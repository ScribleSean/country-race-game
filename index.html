<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Country Race</title>
<meta name="description" content="A live two-player race to name every country in the world.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column; control bar, then a big pannable map, then continent tallies.
   One calm light look on purpose (white, soft green, gray, pale blue), the same in every viewer theme. */
:root{
  color-scheme:light;
  --bg:#f6f8f9; --panel:#ffffff; --fg:#24323a; --muted:#74848d; --line:#e2e8eb;
  --ocean:#dceaf4; --land:#ffffff; --border:#cbd5db; --pin:#b4c0c7;
  --accent:#3f7fc8; --goodline:#5aae7b;
  --miss:#c26571; --missland:#f5dfe2; --none:#d5dce0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:Inter,ui-sans-serif,system-ui,sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body)}
[hidden]{display:none!important}
.app{max-width:1200px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.guesswrap{position:relative;flex:1 1 260px;min-width:0}
#guess{width:100%;box-sizing:border-box;font:500 18px var(--body);padding:12px 14px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
#guess:focus{outline:none;border-color:var(--accent)}
#guess.flash{border-color:var(--goodline)}
#guess.pending{border-color:var(--goodline);border-style:dashed}
.hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 13px var(--body);padding:4px 9px;border-radius:999px;background:var(--line);color:var(--muted);pointer-events:none;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.hint.pending{background:#e3f3e9;color:#2f7a4c}
#guess:disabled{opacity:.55}
.stat{display:flex;flex-direction:column;align-items:flex-end;min-width:84px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font:800 26px var(--display);font-variant-numeric:tabular-nums}
button,select{flex:none;font:600 14px var(--body);border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;white-space:nowrap}
.stat{flex:none}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.08)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.players{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip{font-size:14px;padding:6px 12px}
.chip .cnt{font:800 16px var(--display);font-variant-numeric:tabular-nums;margin-left:2px}
.chip.lead{border-color:var(--goodline);box-shadow:inset 0 0 0 1px var(--goodline)}
.chip.ready{border-color:var(--goodline);box-shadow:inset 0 0 0 1px var(--goodline)}
.chip.ready .tag{color:var(--goodline)}
.count{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(72px,14vw,160px) var(--display);color:var(--fg);background:color-mix(in srgb,var(--ocean) 55%,transparent);pointer-events:none}
.chip .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status{color:var(--muted);font-size:13px}
.mapwrap{position:relative;background:var(--ocean);border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none}
#map{display:block;width:100%;height:auto;cursor:grab}
#map .land{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .25s}
#map .land.other{fill:#f1f4f6}
#map .land.missed{fill:var(--missland)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;font-weight:500}
.legend .key{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend b{font:800 16px var(--display);font-variant-numeric:tabular-nums}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--line)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--panel);flex:none;cursor:pointer}
.swatch.on{outline:2px solid var(--fg);outline-offset:2px}
.swatch:disabled{opacity:.2;cursor:not-allowed}
#map .pin{fill:var(--pin);stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:1}
#map .pin.missed{fill:var(--miss);stroke:var(--miss)}
#map .mlabel{font-family:var(--body);font-weight:700;fill:var(--fg);stroke:var(--panel);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
#map .mlabel.missed{fill:var(--miss)}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;padding:0;font-size:18px;background:var(--panel)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.continents{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 28px;padding-top:6px}
.cont{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.cont h2{font:700 16px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.cont h2 span{font:600 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.names{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.names .n{display:inline-flex;align-items:center;gap:5px}
.names .n.missed{color:var(--miss)}
.empty{color:var(--muted);font-size:13px}
.room{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.room b{font:800 18px var(--display);letter-spacing:.08em}
#code{width:7.5em;font:600 14px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-transform:uppercase}
#code:focus{outline:none;border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){#toast,#map .land{transition:none}}
</style>
</head><body>

<div class="app">
  <header>
    <h1>Country Race</h1>
  </header>
  <section class="bar">
    <div class="guesswrap">
      <input id="guess" placeholder="Type a country" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
      <span class="hint" id="hint" hidden aria-live="polite"></span>
    </div>
    <div class="stat"><span class="lbl">Found</span><span class="num" id="score">0/197</span></div>
    <div class="stat"><span class="lbl">Time</span><span class="num" id="clock">15:00</span></div>
    <select id="dur" aria-label="Time limit">
      <option value="600">10 min</option>
      <option value="900" selected>15 min</option>
      <option value="1200">20 min</option>
      <option value="0">No limit</option>
    </select>
    <button id="startBtn" class="go">Start game</button>
    <button id="giveUp" hidden>Give up</button>
  </section>
  <div class="room" id="room">
    <span id="roomSolo" class="room">
      <button id="hostBtn" type="button">Race a friend</button>
      <input id="code" placeholder="Code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Game code">
      <button id="joinBtn" type="button">Join</button>
    </span>
    <span id="roomOn" class="room" hidden>
      <span>Game code <b id="roomCode"></b></span>
      <button id="copyBtn" type="button">Copy link</button>
      <button id="leaveBtn" type="button">Leave</button>
    </span>
  </div>
  <div class="players" id="players"></div>
  <div class="swatches" id="colors" role="group" aria-label="Your color" hidden></div>
  <div class="legend" id="legend" hidden></div>
  <div class="status" id="status" hidden></div>
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 960 470" role="img" aria-label="World map"></svg>
    <div class="count" id="count" hidden aria-live="assertive"></div>
    <div class="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zreset" aria-label="Reset zoom">⤢</button>
    </div>
  </div>
  <section class="continents" id="continents"></section>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js" integrity="sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu" crossorigin="anonymous"></script>
<script>
// [map name, display name, ...extra accepted answers]
const DATA = {
  "Africa": [["Algeria"],["Angola"],["Benin"],["Botswana"],["Burkina Faso"],["Burundi"],["Cabo Verde","Cabo Verde","Cape Verde"],["Cameroon"],
    ["Central African Rep.","Central African Republic","CAR"],["Chad"],["Comoros"],
    ["Congo","Republic of the Congo","Congo","Congo Brazzaville","Republic of Congo","Congo Republic"],
    ["Dem. Rep. Congo","DR Congo","Democratic Republic of the Congo","Democratic Republic of Congo","DRC","Congo Kinshasa","Zaire"],
    ["Côte d'Ivoire","Ivory Coast","Cote d'Ivoire"],["Djibouti"],["Egypt"],["Eq. Guinea","Equatorial Guinea"],["Eritrea"],["eSwatini","Eswatini","Swaziland"],
    ["Ethiopia"],["Gabon"],["Gambia"],["Ghana"],["Guinea"],["Guinea-Bissau","Guinea-Bissau","Guinea Bissau"],["Kenya"],["Lesotho"],["Liberia"],["Libya"],
    ["Madagascar"],["Malawi"],["Mali"],["Mauritania"],["Mauritius"],["Morocco"],["Mozambique"],["Namibia"],["Niger"],["Nigeria"],["Rwanda"],
    ["São Tomé and Principe","São Tomé and Príncipe","Sao Tome","Sao Tome and Principe"],["Senegal"],["Seychelles"],["Sierra Leone"],["Somalia"],
    ["South Africa"],["S. Sudan","South Sudan"],["Sudan"],["Tanzania"],["Togo"],["Tunisia"],["Uganda"],["Zambia"],["Zimbabwe"]],
  "Europe": [["Albania"],["Andorra"],["Austria"],["Belarus"],["Belgium"],["Bosnia and Herz.","Bosnia and Herzegovina","Bosnia","Bosnia Herzegovina"],["Bulgaria"],
    ["Croatia"],["Cyprus"],["Czechia","Czechia","Czech Republic"],["Denmark"],["Estonia"],["Finland"],["France"],["Germany"],["Greece"],["Hungary"],["Iceland"],
    ["Ireland"],["Italy"],["Kosovo"],["Latvia"],["Liechtenstein"],["Lithuania"],["Luxembourg"],["Malta"],["Moldova"],["Monaco"],["Montenegro"],
    ["Netherlands","Netherlands","Holland"],["Macedonia","North Macedonia","Macedonia"],["Norway"],["Poland"],["Portugal"],["Romania"],["Russia","Russia","Russian Federation"],
    ["San Marino"],["Serbia"],["Slovakia"],["Slovenia"],["Spain"],["Sweden"],["Switzerland"],["Ukraine"],
    ["United Kingdom","United Kingdom","UK","Great Britain","Britain"],["Vatican","Vatican City","Holy See","Vatican"]],
  "Asia": [["Afghanistan"],["Armenia"],["Azerbaijan"],["Bahrain"],["Bangladesh"],["Bhutan"],["Brunei"],["Cambodia"],["China"],["Georgia"],["India"],
    ["Indonesia"],["Iran"],["Iraq"],["Israel"],["Japan"],["Jordan"],["Kazakhstan"],["Kuwait"],["Kyrgyzstan"],["Laos"],["Lebanon"],["Malaysia"],["Maldives"],
    ["Mongolia"],["Myanmar","Myanmar","Burma"],["Nepal"],["North Korea","North Korea","DPRK"],["Oman"],["Pakistan"],["Palestine"],["Philippines"],["Qatar"],
    ["Saudi Arabia"],["Singapore"],["South Korea","South Korea","Korea"],["Sri Lanka"],["Syria"],["Taiwan"],["Tajikistan"],["Thailand"],
    ["Timor-Leste","Timor-Leste","East Timor","Timor Leste"],["Turkey","Turkey","Turkiye"],["Turkmenistan"],
    ["United Arab Emirates","United Arab Emirates","UAE","Emirates"],["Uzbekistan"],["Vietnam","Vietnam","Viet Nam"],["Yemen"]],
  "North America": [["Antigua and Barb.","Antigua and Barbuda","Antigua"],["Bahamas"],["Barbados"],["Belize"],["Canada"],["Costa Rica"],["Cuba"],["Dominica"],
    ["Dominican Rep.","Dominican Republic"],["El Salvador","El Salvador","Salvador"],["Grenada"],["Guatemala"],["Haiti"],["Honduras"],["Jamaica"],["Mexico"],
    ["Nicaragua"],["Panama"],["St. Kitts and Nevis","Saint Kitts and Nevis","Saint Kitts"],["Saint Lucia"],
    ["St. Vin. and Gren.","Saint Vincent and the Grenadines","Saint Vincent and Grenadines","Saint Vincent"],["Trinidad and Tobago","Trinidad and Tobago","Trinidad"],
    ["United States of America","United States","United States of America","USA","US","America"]],
  "South America": [["Argentina"],["Bolivia"],["Brazil"],["Chile"],["Colombia"],["Ecuador"],["Guyana"],["Paraguay"],["Peru"],["Suriname"],["Uruguay"],["Venezuela"]],
  "Oceania": [["Australia"],["Fiji"],["Kiribati"],["Marshall Is.","Marshall Islands"],["Micronesia","Micronesia","Federated States of Micronesia"],["Nauru"],
    ["New Zealand"],["Palau"],["Papua New Guinea","Papua New Guinea","PNG"],["Samoa"],["Solomon Is.","Solomon Islands"],["Tonga"],["Tuvalu"],["Vanuatu"]]
};
// Extra map shapes that light up with a country
const ATTACH = {"Somaliland":"Somalia","N. Cyprus":"Cyprus"};
const MANUAL = {"Tuvalu":[179.2,-8.52]};

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/&/g," and ").replace(/^\s*the\s+/,"").replace(/\bsaint\b/g,"st").replace(/[^a-z]/g,"");

const LIST = []; const ANSWERS = new Map();
for (const [cont, arr] of Object.entries(DATA)) for (const e of arr) {
  const c = {i: LIST.length, key: e[0], name: e[1] || e[0], cont};
  LIST.push(c);
  for (const a of [e[0], ...e.slice(1)]) ANSWERS.set(norm(a), c.i);
}
const TOTAL = LIST.length; // 197
const BYKEY = new Map(LIST.map(c => [c.key, c]));

// ---- state
let me = "local", shared = false, room = null;
let round = null, startedAt = 0, duration = 900, endedAt = null;
const found = new Map();   // my own guesses: index -> {by, at}
const players = new Map(); // uid -> {joinedAt, count, doneAt}; counts are public, guesses are not
let unsubs = [], myJoined = null, myDone = null, announced = false;
// Lobby: both players press Ready; the host's page then starts the round for everyone.
let ready = false, durAt = 0, startingFor = 0;
const COUNTDOWN = 3000;
function present(){
  const list = [{uid: me, ready, round: round || 0, dur: +$("dur").value, durAt, color: myColor}];
  if (!room?.peers) return list;
  // One entry per player; if a player has the page open twice, their most recently updated tab counts
  const byUid = new Map();
  for (const p of room.peers()) {
    if (p.kind !== "viewer") continue;
    const pr = p.presence || {}, uid = p.by || pr.uid;
    if (!uid || uid === me || typeof pr.round !== "number" && pr.round !== null) continue;
    const prev = byUid.get(uid);
    if (prev && prev.at >= (p.updatedAt || 0)) continue;
    byUid.set(uid, {uid, ready: !!pr.ready, round: +pr.round || 0, dur: pr.dur, durAt: +pr.durAt || 0, color: PALETTE[pr.color] ? pr.color : null, at: p.updatedAt || 0});
  }
  return list.concat([...byUid.values()]);
}
// Time limit: whoever changed it last wins, so both lobbies show the same setting.
function syncDur(){
  let best = null; for (const p of present()) if (p.durAt && typeof p.dur === "number" && (!best || p.durAt > best.durAt)) best = p;
  if (best && best.uid !== me && +$("dur").value !== best.dur && document.activeElement !== $("dur")) { $("dur").value = String(best.dur); durAt = best.durAt; }
}
function maybeStart(){
  if (!shared || !room || !inLobby()) return;
  const ps = present();
  if (ps.length < 2 || !ps.every(p => p.ready)) return;
  if (!isHost) return;                                         // the host's page starts it for both screens
  const nr = Math.max(...ps.map(p => p.round)) + 1;
  if (startingFor >= nr) return; startingFor = nr;
  beginRound(nr);
}
function beginRound(nr){
  const dur = +$("dur").value, st = {round: nr, startedAt: Date.now() + COUNTDOWN, duration: dur, endedAt: null};
  if (shared) {
    if (!isHost) return;
    hostGame = st; hostDocs = {round: nr, players: {}}; saveHost();
    send({t: "start", round: nr, delay: COUNTDOWN, duration: dur});
  }
  applyState(st);
}

const $ = id => document.getElementById(id);
const toastEl = $("toast"); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove("on"), 1800); }

function playerOrder(){ return [...players.entries()].sort((a,b)=>a[1].joinedAt-b[1].joinedAt).map(x=>x[0]); }
function countOf(uid){ return uid === me ? found.size : (players.get(uid)?.count || 0); }
function timeUp(){ return round != null && !!duration && Date.now() >= startedAt + duration * 1000; }
function allDone(){ if (round == null) return false; if (timeUp() || endedAt || Date.now() - startedAt > 2 * 3600e3) return true; return players.size > 0 && [...players.entries()].every(([id, p]) => id === me ? !!myDone : !!p.doneAt); }
// Player colors: each player picks one in the lobby; two players can't hold the same one.
// Soft colors that read on white land and under dark labels
const PALETTE = {sage: "#86c79f", sky: "#86b7e6", peach: "#f2b791", lilac: "#bcaae6", mint: "#84cfc6", butter: "#ead27f", rose: "#eba7c0", slate: "#a3b3c4"};
let myColor = "sage";
try { const s = localStorage.getItem("country-race-color"); if (PALETTE[s]) myColor = s; } catch {}
function colorKeyOf(uid){
  if (uid === me) return myColor;
  const c = present().find(p => p.uid === uid)?.color || players.get(uid)?.color;   // live choice first
  return PALETTE[c] ? c : (myColor === "sky" ? "sage" : "sky");
}
function colorOf(uid){ return PALETTE[colorKeyOf(uid)]; }
function takenColors(){ return new Set(present().filter(p => p.uid !== me).map(p => colorKeyOf(p.uid))); }
// If the other player already holds my color, the player with the later id moves to the first free one.
function resolveColorClash(){
  for (const p of present()) {
    if (p.uid !== me && colorKeyOf(p.uid) === myColor && me > p.uid) {
      const taken = takenColors(); myColor = Object.keys(PALETTE).find(k => !taken.has(k)) || myColor;
    }
  }
}
function pickColor(k){
  if (!PALETTE[k] || takenColors().has(k)) return;
  myColor = k; try { localStorage.setItem("country-race-color", k); } catch {}
  render(); if (shared) sync();
}
function nameOf(uid){ return uid === me ? "You" : "Friend"; }
function counting(){ return round != null && !endedAt && !myDone && Date.now() < startedAt; }
function inLobby(){ return round == null || allDone(); }
function isPlaying(){ if (round == null || endedAt || myDone || Date.now() < startedAt) return false; return !duration || Date.now() < startedAt + duration * 1000; }
function isOver(){ return round != null && !isPlaying() && !counting(); }

// ---- map
const svg = d3.select("#map");
// Stripes of both players' colors for countries you both named
const bothPat = svg.append("defs").append("pattern").attr("id", "bothPat").attr("patternUnits", "userSpaceOnUse")
  .attr("width", 4).attr("height", 4).attr("patternTransform", "rotate(45)");
const patA = bothPat.append("rect").attr("width", 2).attr("height", 4);
const patB = bothPat.append("rect").attr("x", 2).attr("width", 2).attr("height", 4);
const g = svg.append("g");
let pins = new Map(), shapes = new Map(), labels = new Map(), zoom;
// Labels sit at each country's visual center (the point deepest inside its main landmass)
// and are sized to fit inside it, between 6px and 15px on screen at any zoom.
// Bigger countries are placed first; a name that would overlap one already placed is hidden
// until zooming in makes room for it.
let curK = 1, layoutQueued = false;
const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth1(s){ measureCtx.font = '700 100px Inter, ui-sans-serif, system-ui, sans-serif'; return measureCtx.measureText(s).width / 100 * 1.06; }
function layoutLabels(k){
  curK = k;
  const placed = [], pad = 1.2 / k;
  const hit = b => placed.some(p => b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0);
  const order = [...labels.values()].sort((a, b) => b.r - a.r);
  for (const l of order) {
    if (!l.on) { l.el.attr("display", "none"); continue; }
    if (!l.w1) l.w1 = textWidth1(l.el.text());
    const fit = Math.min(0.86 * l.span / l.w1, 1.15 * l.r);   // map units that fit inside the country
    const px = Math.max(6, Math.min(15, fit * k)), fs = px / k;
    const w = l.w1 * fs + 2 * pad, h = fs * 1.1 + 2 * pad, [cx, cy] = l.xy;
    const b = {x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2};

// PeerJS's public broker is used only to find the other browser; game data goes browser to browser.
// The host's page holds the game (round, start time, each player's record) and relays it to the guest.
const ID_PREFIX = "country-race-game-", CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", DROP_MS = 8000;
let code = null, isHost = false, peer = null, conn = null, remote = null, lastHeard = 0, dialAt = 0, full = false;
let hostGame = null, hostDocs = {round: null, players: {}};   // host only
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const hostKey = c => "country-race-host-" + c;
const cleanCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
function newCode(){ const a = crypto.getRandomValues(new Uint8Array(5)); return [...a].map(x => CODE_CHARS[x % CODE_CHARS.length]).join(""); }
function saveHost(){ if (isHost) store.set(hostKey(code), {game: hostGame, docs: hostDocs}); }
function hostPutPlayer(r, uid, doc){ if (hostDocs.round !== r) return; hostDocs.players[uid] = doc; saveHost(); }
function send(m){ if (conn?.open) try { conn.send(m); } catch {} }
function sendState(){ send({t: "state", game: hostGame, now: Date.now(), round: hostDocs.round, players: hostDocs.players}); }

function onMessage(m){
  lastHeard = Date.now();
  if (!m || typeof m !== "object") return;
  switch (m.t) {
    case "hello": if (remote && typeof m.uid === "string") { remote.uid = m.uid; render(); } break;
    case "presence":
      if (!remote || !m.pr || typeof m.pr !== "object") break;
      if (!remote.uid && typeof m.pr.uid === "string") remote.uid = m.pr.uid;
      remote.presence = m.pr; remote.at = Date.now(); onRoomPeers(room.peers()); break;
    case "player":
      if (isHost) { if (!remote?.uid) break; hostPutPlayer(m.round, remote.uid, m.doc); ingestPlayers(m.round, {[remote.uid]: m.doc}); }
      else if (typeof m.uid === "string" && m.uid !== me) ingestPlayers(m.round, {[m.uid]: m.doc});
      break;
    case "want": if (isHost) sendState(); break;
    case "start":
      // The start signal carries a countdown length, not a clock time, so both screens count down together
      if (isHost || typeof m.round !== "number" || m.round <= (round || 0)) break;
      applyState({round: m.round, startedAt: Date.now() + Math.min(+m.delay || 0, 5000), duration: +m.duration || 0, endedAt: null});
      break;
    case "state": {
      if (isHost) break;
      // Times come from the host's clock; shift them onto this one
      const g = m.game && typeof m.game.round === "number" ? {...m.game} : null, skew = Date.now() - (+m.now || Date.now());
      if (g) { g.startedAt = (+g.startedAt || 0) + skew; g.endedAt = g.endedAt ? g.endedAt + skew : null; }
      if ((g?.round ?? null) !== round || (g && (g.endedAt || null) !== endedAt)) applyState(g);
      if (g && m.round === round) ingestPlayers(round, m.players);
      break;
    }
    case "full": full = true; setStatus("This game already has two players."); try { conn?.close(); } catch {} break;
  }
}
function attach(c, uid){
  if (conn && conn !== c) try { conn.close(); } catch {}
  conn = c; remote = {uid, presence: null, at: 0}; lastHeard = Date.now(); lastPresence = "";
  const gone = () => { if (c === conn) dropped(); };
  c.on("close", gone); c.on("error", gone);
  setStatus("");
}
function dropped(){
  const had = !!remote?.presence; conn = null; remote = null;
  if (had) toast("The other player disconnected");
  setStatus(isHost ? "The other player disconnected. They can rejoin with the same link." : "Lost the connection to the host. Reconnecting…");
  onRoomPeers([]); render();
  if (!isHost) { dialAt = 0; setTimeout(dial, 1500); }
}
function openHost(){
  peer = new Peer(ID_PREFIX + code, {debug: 0});
  peer.on("open", () => setStatus(""));
  peer.on("connection", c => {
    c.on("data", m => {
      if (c === conn) return onMessage(m);
      if (m?.t !== "hello" || typeof m.uid !== "string") return;
      // One guest per game; the same player coming back (after a reload) replaces their old link
      if (conn?.open && remote?.uid && remote.uid !== m.uid && Date.now() - lastHeard < DROP_MS) { c.send({t: "full"}); setTimeout(() => c.close(), 500); return; }
      attach(c, m.uid);
      send({t: "hello", uid: me}); sendState(); render();
    });
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id") setStatus("Reconnecting to the game…");   // the old page's link is still closing
    else if (e.type !== "peer-unavailable") setStatus("Can't reach the connection service. Retrying…");
  });
}
function openGuest(){
  peer = new Peer({debug: 0});
  setStatus("Connecting to the host…");
  peer.on("open", () => { dialAt = 0; dial(); });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") setStatus("Waiting for the host. Check the code, or ask them to open the game.");
    else setStatus("Can't reach the connection service. Retrying…");
  });
}
function dial(){
  if (full || conn?.open || !peer?.open || Date.now() - dialAt < 6000) return;
  dialAt = Date.now();
  const c = peer.connect(ID_PREFIX + code, {reliable: true});
  c.on("open", () => { attach(c, null); c.send({t: "hello", uid: me}); render(); });
  c.on("data", m => { if (c === conn) onMessage(m); });
}
// Every 2 seconds: keep the link alive, notice a silent drop, and reconnect what broke.
function heartbeat(){
  if (!peer || peer.destroyed) { peer = null; return isHost ? openHost() : openGuest(); }
  if (peer.disconnected) { try { peer.reconnect(); } catch {} }
  if (conn) {
    if (conn.open) send({t: "ping"});
    if (Date.now() - lastHeard > DROP_MS) { const c = conn; try { c.close(); } catch {} if (c === conn) dropped(); }
  } else if (!isHost) dial();
  if (!isHost && !conn && dialAt && Date.now() - dialAt > 5000 && !full && peer.open)
    setStatus("Can't reach the host yet. Check the code, or ask them to open the game.");
}

// ---- boot
function setStatus(msg){ const s = $("status"); s.textContent = msg || ""; s.hidden = !msg; }
function setupRoom(){
  const go = c => { location.href = location.pathname + "?join=" + c; };
  $("hostBtn").onclick = () => { const c = newCode(); store.set(hostKey(c), {game: null, docs: {round: null, players: {}}}); go(c); };
  $("joinBtn").onclick = () => { const c = cleanCode($("code").value); if (c.length < 4) { toast("Type the game code"); return; } go(c); };
  $("code").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("joinBtn").click(); } });
  $("copyBtn").onclick = async () => {
    const url = location.origin + location.pathname + "?join=" + code;
    try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { prompt("Send this link to the other player", url); }
  };
  $("leaveBtn").onclick = () => { location.href = location.pathname; };
  $("roomOn").hidden = !shared; $("roomSolo").hidden = shared;
  if (shared) $("roomCode").textContent = code;
}
async function boot(){
  try { await drawMap(); } catch { setStatus("The map didn't load. Reload the page."); }
  const q = cleanCode(new URLSearchParams(location.search).get("join"));
  if (q.length >= 4) {
    code = q; shared = true; isHost = !!store.get(hostKey(code));
    me = store.get("country-race-uid");
    if (typeof me !== "string" || !me) { me = "p" + newCode() + newCode(); store.set("country-race-uid", me); }
    room = {
      peers: () => remote?.uid && remote.presence && conn?.open ? [{kind: "viewer", by: remote.uid, presence: remote.presence, updatedAt: remote.at}] : [],
      presence: pr => { send({t: "presence", pr}); return Promise.resolve(); }
    };
  }
  setupRoom();
  render(); setInterval(tick, 250); tick();
  if (!shared) return;
  if (typeof Peer !== "function") { setStatus("Couldn't load the connection library. Reload the page."); return; }
  if (isHost) { const s = store.get(hostKey(code)) || {}; hostGame = s.game || null; hostDocs = s.docs || {round: null, players: {}}; if (hostGame) applyState(hostGame); openHost(); }
  else openGuest();
  setInterval(heartbeat, 2000);
  addEventListener("pagehide", () => { try { conn?.close(); peer?.destroy(); } catch {} });
}
boot();
</script>

</body></html>
