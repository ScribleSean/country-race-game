<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Country Race</title>
<meta name="description" content="A live two-player race to name every country in the world.">
<meta name="theme-color" content="#f6f8f9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the whole game fits the screen and the page itself never scrolls.
   Top: scoreboard and clock. Wide screens: input above the map, found list in a column beside it.
   Narrow screens: input, then the found list, then the map. Lobby and results are a card over the play area.
   One calm light look on purpose (white, soft gray, pale blue), the same in every viewer theme. */
:root{
  color-scheme:light;
  --bg:#f6f8f9; --panel:#ffffff; --fg:#1c2a31; --ink:#101820; --muted:#55646d; --line:#dbe2e6;
  --ocean:#d3e4f1; --land:#f1f3f5; --border:#7b8a94; --pin:#8d9ba3;
  --accent:#1f63c4; --goodline:#2f8f5b; --good:#1f6b43;
  --miss:#a8323f; --missland:#f3c9cf; --none:#b4bdc4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:Inter,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:14px/1.35 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.app{position:fixed;top:0;left:0;right:0;height:var(--vh,100dvh);max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
button,select,input{font-family:var(--body)}
button,select{flex:none;min-height:40px;font-weight:600;font-size:14px;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover:not(:disabled){filter:brightness(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.list:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sw{width:14px;height:14px;border-radius:4px;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(16,24,32,.35)}
button.link{border:0;background:none;padding:4px;color:var(--muted);font-weight:500;text-decoration:underline;align-self:center}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(16,24,32,.35)}

/* top: title, scoreboard, clock */
.top{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
h1{font:800 22px var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap}
.board{display:flex;gap:8px;flex:1;min-width:0}
.pchip{display:flex;align-items:baseline;gap:6px;min-width:0;overflow:hidden;padding:5px 12px;border-radius:12px;background:var(--c);color:var(--t);font-weight:700;border:3px solid var(--c)}
.pchip.lead{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.pname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pcount{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.ppct{font-size:13px;font-variant-numeric:tabular-nums}
.plead,.ptag{font-size:12px;font-weight:700;background:#fff;color:var(--ink);padding:1px 7px;border-radius:999px;white-space:nowrap;align-self:center}
.clock{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
.share{height:8px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;flex:none}
.share i{position:absolute;top:0;bottom:0;width:0;transition:width .3s}
#shareMe{left:0} #shareOpp{right:0}
.status{color:var(--muted);font-size:13px;flex:none}

/* play area */
.main{flex:1;min-height:0;position:relative;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(96px,1fr) auto}
.play{display:flex;gap:8px;min-width:0}
.guesswrap{position:relative;flex:1;min-width:0}
#guess{width:100%;font-weight:500;font-size:18px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
#guess:focus{outline:none;border-color:var(--accent)}
#guess.flash{border-color:var(--goodline)}
#guess.pending{border-color:var(--goodline);border-style:dashed}
#guess:disabled{opacity:.6;background:var(--bg)}
.hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:600;font-size:13px;padding:4px 9px;border-radius:999px;background:var(--line);color:var(--muted);pointer-events:none;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.hint.pending{background:#e3f3e9;color:var(--good)}

/* found list */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panelhead{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{padding:5px 12px;font-size:13px;border-radius:999px;border-color:transparent;background:none;color:var(--muted)}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.tab b{margin-left:5px;font-variant-numeric:tabular-nums}
#giveUp{padding:5px 12px;font-size:13px;color:var(--muted)}
/* review of a finished round */
.review{display:flex;flex-direction:column;gap:6px;padding:8px;border-bottom:1px solid var(--line);flex:none}
.rvtop{display:flex;align-items:center;gap:8px;min-height:40px}
.review p{margin:0;font:700 15px var(--display);flex:1;min-width:0}
.app[data-phase="done"] .panelhead,.app[data-phase="wait"] .panelhead{display:none}
.rvrow{display:flex;gap:6px}
.rvrow input{flex:1 1 0;min-width:0;min-height:40px;font-size:16px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--fg)}
.rvrow select{flex:0 1 46%;min-width:0;font-size:16px;padding:6px 8px}
.filters{display:flex;flex-wrap:wrap;gap:4px;padding:2px}
.filters .tab{padding:5px 10px;border-color:var(--line)}
.rv{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.rv:hover{background:var(--bg)}
.rv[aria-selected="true"]{background:var(--fg);color:#fff}
.rv[aria-selected="true"] .st{color:#fff}
.rv .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .st{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.rv .sw{width:16px;height:16px}
.mkdot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid currentColor;opacity:.7}
#giveUp.sure{color:var(--miss);border-color:var(--miss)}
.conts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:6px 8px 0;font-size:12px;text-align:center;flex:none}
.cc{background:var(--bg);border-radius:6px;padding:3px 2px;color:var(--muted);white-space:nowrap;overflow:hidden}
.cc b{display:block;color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px}
.cc .long{display:none}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;overscroll-behavior:contain}
.names{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.names .n{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.names .n.new{animation:pop .9s ease-out}
@keyframes pop{from{background:#cfeedd;box-shadow:0 0 0 4px #cfeedd}to{background:transparent;box-shadow:0 0 0 4px transparent}}
.grp{padding:6px 0 8px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0;padding-top:0}
.grp h3{font:700 13px var(--display);margin:0 0 5px;display:flex;justify-content:space-between;gap:8px}
.grp h3 span{font:600 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px}

/* map */
.mapwrap{position:relative;background:var(--ocean);border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none;min-height:0;
  height:min(49vw,calc(var(--vh,100dvh) * .3))}
#map{display:block;width:100%;height:100%;cursor:grab}
#map .land{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .25s}
#map .land.other{fill:#e4e8eb}
#map .land.on{stroke:#fff;stroke-width:.9}
#map .land.sel{stroke:var(--ink);stroke-width:3}
.app[data-phase="done"] #map .land:not(.other),.app[data-phase="wait"] #map .land:not(.other),.app[data-phase="done"] #map .mk,.app[data-phase="wait"] #map .mk{cursor:pointer}
#map .pin{fill:var(--pin);stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:1}
/* small places: a white disc until someone names it, then the same solid color the land would get */
#map .mk{fill:#fff;stroke:#3d4b54;stroke-width:1.6;vector-effect:non-scaling-stroke;transition:fill .25s}
#map .mk.on{stroke:#fff;stroke-width:1.8;filter:drop-shadow(0 0 .6px var(--ink))}
#map .mk.sel{stroke:var(--ink);stroke-width:3.5}
.maptog{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
.maptog button{padding:4px 12px;font-size:13px;border-radius:999px;background:var(--panel);color:var(--muted);border-color:var(--border)}
.maptog button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
#togMore{display:none;font-size:14px;font-weight:700}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--panel) 92%,transparent);font-size:12px;font-weight:600;pointer-events:none}
.legend .key{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#map .mlabel{font-family:var(--body);font-weight:700;fill:var(--ink);stroke:#fff;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
#map .mlabel.missed{fill:var(--miss)}
#map .mlabel.sel{font-weight:800}
.count{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(56px,14vw,160px) var(--display);color:var(--fg);background:color-mix(in srgb,var(--ocean) 55%,transparent);pointer-events:none}
.zoomctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:3}
.zoomctl button{width:40px;height:40px;padding:0;font-size:18px}

/* lobby and results card */
.sheet{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);overscroll-behavior:contain}
.card{margin:auto;width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(36,50,58,.08)}
.card h2{font:800 28px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:-6px 0 0}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rstat:first-child:nth-last-child(2){grid-column:1/-1}
.rstat{border-radius:12px;padding:10px 12px;background:var(--c);color:var(--t);min-width:0}
.rstat .rwho{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstat .big{font:800 36px/1.05 var(--display);font-variant-numeric:tabular-nums}
.rstat .small{font-size:12px}
.rnone{grid-column:1/-1;color:var(--fg);font-size:14px;display:flex;align-items:center;gap:8px}
.codebox{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 12px}
.codebox b{font:800 26px/1 var(--display);letter-spacing:.12em;flex:1}
.who{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.prow .sw{width:18px;height:18px}
.prow .tag{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prow.ready .tag{color:var(--good)}
details.setup{border-top:1px solid var(--line);padding-top:10px}
details.setup summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;padding:11px 0}
details.setup[open] summary{margin-bottom:10px}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .field{flex:1 1 130px}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.swcell{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.swatch{width:44px;height:44px;min-height:0;padding:0;border-radius:50%;border:4px solid var(--panel);box-shadow:0 0 0 1px var(--border)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.swatch.taken,.swatch.taken:disabled{opacity:1;cursor:not-allowed;border-width:13px;box-shadow:0 0 0 2px var(--muted)}
.swcap{font-size:12px;font-weight:700;color:var(--fg);height:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card input[type=text]{width:100%;font-size:16px;font-weight:500;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.card select{width:100%;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .go{flex:1 1 160px;padding:13px 14px;font-size:16px}
.note{color:var(--muted);font-size:13px;margin:-4px 0 0;min-height:1em}
.join{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.join #code{flex:1 1 90px;min-width:0;text-transform:uppercase}
.credit{color:var(--muted);font-size:12px;margin:0;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}

.app[data-phase="done"] .play,.app[data-phase="wait"] .play{display:none}
@media (pointer:coarse){
  button,select,.rv,.rvrow input,.card input[type=text]{min-height:44px}
  .zoomctl button{width:44px;height:44px}
}
@media (max-width:899px){
  /* small map: the two map options sit behind one button next to the zoom buttons */
  #togMore{display:block}
  .maptog{left:auto;top:auto;right:8px;bottom:60px;display:none}
  .maptog.open{display:flex}
  h1{display:none}
  .app[data-phase="done"] .main,.app[data-phase="wait"] .main{grid-template-rows:minmax(96px,1fr) auto}
  .app[data-phase="home"] .top,.app[data-phase="lobby"] .top{display:none}
  .pchip{flex:1 1 0;padding:5px 9px;gap:5px}
  .plead .w{display:none}
}
@media (max-width:899px) and (max-height:480px) and (orientation:landscape){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .play{grid-column:1 / -1}
  .mapwrap{height:auto}
}
@media (min-width:900px){
  .app{gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .main{gap:10px;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr)}
  .play{grid-column:1;grid-row:1}
  .mapwrap{grid-column:1;grid-row:2;height:auto}
  .panel{grid-column:2;grid-row:1 / span 2}
  .conts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cc .long{display:inline} .cc .short{display:none}
  .board{flex:none}
  .pchip{padding:6px 14px}
  .zoomctl{flex-direction:column;right:10px;bottom:10px}
  .clock{font-size:28px}
}
@media (prefers-reduced-motion: reduce){
  #toast,#map .land,#map .mk,.share i{transition:none}
  *{scroll-behavior:auto!important}
  .names .n.new{animation:none}
}
</style>
</head><body>

<div class="app" id="app" data-phase="home">
  <header class="top">
    <h1>Country Race</h1>
    <div class="board" id="board" hidden></div>
    <span class="clock" id="clock" role="timer" title="Time">15:00</span>
  </header>
  <div class="share" id="share" role="img" aria-label="Share of the world found" hidden><i id="shareMe"></i><i id="shareOpp"></i></div>
  <div class="status" id="status" role="status" hidden></div>
  <main class="main">
    <div class="play">
      <div class="guesswrap">
        <input id="guess" placeholder="Type a country" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Type a country" disabled>
        <span class="hint" id="hint" hidden aria-live="polite"></span>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="Countries found">
      <div class="panelhead">
        <div class="tabs" id="tabs" role="tablist"></div>
        <button id="giveUp" type="button" hidden>Give up</button>
      </div>
      <div class="review" id="review" hidden>
        <div class="rvtop"><p id="rvSummary"></p><button id="sheetBtn" type="button" hidden>Results</button></div>
        <div class="rvrow">
          <input type="search" id="rvSearch" placeholder="Search countries" aria-label="Search countries" autocomplete="off" spellcheck="false">
          <select id="rvRegion" aria-label="Region">
            <option value="all">All regions</option>
            <option>Africa</option><option>Asia</option><option>Europe</option><option>North America</option><option>South America</option><option>Oceania</option>
            <option value="small">Small places</option>
          </select>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Show countries found by"></div>
      </div>
      <div class="conts" id="conts" hidden></div>
      <div class="list" id="list" role="tabpanel" aria-label="Countries you found" tabindex="0"></div>
    </aside>
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 960 470" role="img" aria-label="World map"></svg>
      <div class="maptog" id="maptog" role="group" aria-label="Show on the map">
        <button id="togNames" type="button" aria-pressed="true">Names</button>
        <button id="togMarkers" type="button" aria-pressed="true">Markers</button>
      </div>
      <div class="legend" id="legend" hidden></div>
      <div class="count" id="count" hidden aria-live="assertive"></div>
      <div class="zoomctl">
        <button id="togMore" type="button" aria-label="Map options: names and markers" aria-expanded="false" aria-controls="maptog">Aa</button>
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zout" type="button" aria-label="Zoom out">−</button>
        <button id="zreset" type="button" aria-label="Reset zoom">⤢</button>
      </div>
    </div>
    <section class="sheet" id="sheet" aria-labelledby="sheetTitle">
      <div class="card">
        <h2 id="sheetTitle">Country Race</h2>
        <p class="sub" id="sheetSub"></p>
        <div class="result" id="result" hidden></div>
        <div class="codebox" id="roomOn" hidden>
          <span class="lbl">Game code</span><b id="roomCode"></b>
          <button id="copyBtn" type="button">Copy link</button>
        </div>
        <div class="who" id="players" hidden></div>
        <details class="setup" id="setup" open>
          <summary>Color, name and time</summary>
          <div class="fields">
            <div class="field"><span class="lbl" id="colorLbl">Your color</span><div class="swatches" id="colors" role="group" aria-labelledby="colorLbl"></div></div>
            <div class="row">
              <label class="field" id="nameField"><span class="lbl">Your name</span><input type="text" id="nameInput" maxlength="14" placeholder="Optional" autocomplete="off" spellcheck="false"></label>
              <label class="field"><span class="lbl">Time limit</span>
                <select id="dur">
                  <option value="600">10 min</option>
                  <option value="900" selected>15 min</option>
                  <option value="1200">20 min</option>
                  <option value="0">No limit</option>
                </select></label>
            </div>
          </div>
        </details>
        <div class="actions">
          <button id="startBtn" type="button" class="go">Play solo</button>
          <button id="viewBtn" type="button" hidden>Review map</button>
        </div>
        <p class="note" id="readyNote" aria-live="polite" hidden></p>
        <div class="join" id="roomSolo">
          <button id="hostBtn" type="button">Race a friend</button>
          <input type="text" id="code" placeholder="Code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Game code">
          <button id="joinBtn" type="button">Join</button>
        </div>
        <button id="leaveBtn" type="button" class="link" hidden>Leave game</button>
        <p class="credit">Map data: Natural Earth</p>
      </div>
    </section>
  </main>
</div>

  const lastDone = Math.max(myDone || 0, ...[...players.values()].map(p => p.doneAt || 0));
  const endRef = endedAt || (round != null && allDone() && !timeUp() && lastDone ? lastDone : null);
  if (round != null) {
    const endedAt = endRef;
    if (!duration) { const el = Math.floor(((endedAt || Date.now()) - startedAt) / 1000); txt = `${Math.floor(el/60)}:${String(el%60).padStart(2,"0")}`; }
    else { const left = Math.min(duration, Math.max(0, Math.ceil((startedAt + duration*1000 - (endedAt || Date.now())) / 1000))); txt = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; }
  }
  if (round == null) { const d = +$("dur").value; txt = d ? `${d/60}:00` : "0:00"; }
  $("clock").textContent = txt;
  const cd = $("count"), cnt = counting();
  cd.hidden = !cnt; if (cnt) { const n = String(Math.ceil((startedAt - Date.now()) / 1000)); if (cd.textContent !== n) cd.textContent = n; }
  const p = phase(); if (p !== lastPlaying) { lastPlaying = p; render(); }
  if (!announced && players.size > 1 && allDone()) { announced = true; render(); if (shared) sync(); }
}
$("viewBtn").onclick = () => { sheetHidden = true; render(); $("list").focus(); };
$("sheetBtn").onclick = () => { sheetHidden = false; render(); };
// Give up takes two taps, so a stray tap can't end your game
let giveUpT = null;
function disarmGiveUp(){ clearTimeout(giveUpT); const b = $("giveUp"); b.classList.remove("sure"); b.textContent = "Give up"; }
$("giveUp").onclick = () => {
  const b = $("giveUp");
  if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Tap again to give up"; giveUpT = setTimeout(disarmGiveUp, 3000); return; }
  disarmGiveUp(); finish();
};
// Keep the whole game inside the visible area when a phone keyboard opens
function fitViewport(){
  const vv = window.visualViewport; if (!vv || Math.abs(vv.scale - 1) > 0.01) return;
  document.documentElement.style.setProperty("--vh", vv.height + "px");
  $("app").style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : "";
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitViewport); visualViewport.addEventListener("scroll", fitViewport); fitViewport(); }
wide.addEventListener?.("change", () => { listSig = ""; render(); });

// ---- actions
// Typing rules. The one promise: what you type is never wiped out while you might still be typing.
// - A new country that can't be the start of any other answer counts the instant it's complete.
// - A new country that is also the start of a longer answer ("niger" -> "nigeria", "dominica" ->
//   "dominican republic", "uk" -> "ukraine") shows what it will count as; Enter takes it now,
//   or it counts after a pause.
// - A country you already have is ignored while it could still become one you don't have
//   ("uk" after the UK, on the way to "ukraine"). Otherwise it's marked "Already found" and
//   cleared only after a longer pause (or Enter).
const ANSWER_KEYS = [...ANSWERS.keys()];
const HOLD_MS = 1200, DUP_MS = 1600;
const longerAnswers = n => ANSWER_KEYS.filter(k => k.length > n.length && k.startsWith(n)).map(k => ANSWERS.get(k));
let holdTimer = null;
function setHint(text, kind){
  const h = $("hint"); h.hidden = !text; h.textContent = text || ""; h.className = "hint" + (kind ? " " + kind : "");
  $("guess").classList.toggle("pending", kind === "pending");
}
function accept(i){
  const inp = $("guess"); inp.value = ""; setHint();
  found.set(i, {by: me, at: Date.now()}); render();
  inp.classList.add("flash"); setTimeout(() => inp.classList.remove("flash"), 350);
  if (found.size === TOTAL) finish(); else if (shared) sync();
}
function tryGuess(force){
  clearTimeout(holdTimer);
  const inp = $("guess"), n = norm(inp.value), i = ANSWERS.get(n);
  if (!isPlaying() || i == null) { setHint(); return; }
  const longer = longerAnswers(n);
  if (!found.has(i)) {
    // Wait only if it could still become another country you don't have, or a longer name for this one
    if (force || !longer.some(j => j === i || !found.has(j))) return accept(i);
    setHint(`${LIST[i].name} ↵`, "pending");
    holdTimer = setTimeout(() => tryGuess(true), HOLD_MS);
    return;
  }
  if (longer.some(j => !found.has(j))) { setHint(); return; }   // still on the way to something new
  setHint("Already found", "dup");
  const clear = () => { if (norm(inp.value) === n) { inp.value = ""; setHint(); } };
  if (force) clear(); else holdTimer = setTimeout(clear, DUP_MS);
}
$("guess").addEventListener("input", () => tryGuess(false));
$("guess").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); tryGuess(true); } });
// Saves my guesses on this device (to restore them after a reload) and sends my player record to the host.
function sync(){
  if (!shared || round == null) return;
  const r = round, obj = {};
  found.forEach((v, k) => obj[k] = v.at);
  store.set(`country-race-found-${code}-${r}`, obj);
  const doc = {joinedAt: myJoined || Date.now(), count: found.size, doneAt: myDone || null, got: myGotList(), color: myColor, name: myName};
  if (isHost) hostPutPlayer(r, me, doc);
  send({t: "player", round: r, uid: me, doc});
}
$("dur").addEventListener("change", () => { durAt = Math.max(Date.now(), ...present().map(p => +p.durAt || 0)) + 1; pushPresence(); tick(); });
$("startBtn").onclick = () => {
  if (shared && room && present().length > 1) { ready = !ready; render(); maybeStart(); return; }
  beginRound(Math.max(...present().map(p => p.round)) + 1);
};
// Give up (or finding all 197) ends only your own game; the other player keeps going.
function finish(){
  myDone = Date.now();
  if (shared) sync(); else { const p = players.get(me); if (p) p.doneAt = myDone; }
  lastPlaying = null; tick(); render();
}

function applyState(d){
  const newRound = d ? d.round : null;
  // Keep the start time this page already has for the round (set from the live countdown on its own clock)
  startedAt = (newRound === round && startedAt) ? startedAt : (d?.startedAt || 0);
  duration = d?.duration ?? 900; endedAt = d?.endedAt || null;
  const wait = startedAt - Date.now(); if (wait > 0 && wait < 10000) setTimeout(tick, wait + 5);   // open the input the moment the countdown ends
  if (newRound !== round) {
    round = newRound; found.clear(); players.clear(); unsubs.forEach(u => u()); unsubs = [];
    myJoined = null; myDone = null; announced = false; ready = false; joinedRound = null;
    guestOwner = {}; sheetHidden = false; tabRace = null; listSig = "";
    sel = null; rvFilter = "all"; rvRegion = "all"; rvQuery = ""; $("rvSearch").value = ""; $("rvRegion").value = "all";
    if (shared && round != null) { enterRound(round); setTimeout(() => onRoomPeers(room.peers()), 0); }
    else if (round != null) players.set(me, {joinedAt: Date.now(), count: 0, doneAt: null});
  }
  lastPlaying = null; tick(); render();
}
let joinedRound = null;
function enterRound(r){
  // Restore my own guesses after a reload
  const saved = store.get(`country-race-found-${code}-${r}`);
  if (saved && typeof saved === "object") for (const [k, at] of Object.entries(saved)) if (LIST[+k]) found.set(+k, {by: me, at: +at || 0});
  if (isHost) ingestPlayers(r, hostDocs.round === r ? hostDocs.players : {});
  else send({t: "want"});   // the host answers with the full game
  render();
}
// Player records for round r, from the host's copy (or the host itself).
function ingestPlayers(r, docs){
  if (r !== round || !docs || typeof docs !== "object") return;
  for (const [uid, d] of Object.entries(docs)) {
    if (!d || typeof d !== "object") continue;
    const got = Array.isArray(d.got) ? d.got.slice(0, TOTAL).map(Number).filter(i => LIST[i]) : null;
    if (uid === me && got) for (const i of got) if (!found.has(i)) found.set(i, {by: me, at: 0});
    mergePlayer(uid, {joinedAt: +d.joinedAt || 0, count: +d.count || 0, doneAt: +d.doneAt || null, got, color: d.color, name: d.name});
  }
  const mineP = players.get(me);
  if (mineP) { myJoined = myJoined || mineP.joinedAt; myDone = myDone || mineP.doneAt || null; }
  if (joinedRound !== r) { joinedRound = r; if (!mineP) { myJoined = Date.now(); players.set(me, {joinedAt: myJoined, count: found.size, doneAt: null}); } sync(); }
  lastPlaying = null; tick(); render();
}
// Scores only go up within a round and "finished" never undoes, so merging keeps the freshest view
// whichever channel (live room or stored data) arrives first.
function mergePlayer(uid, p){
  const old = players.get(uid) || {};
  players.set(uid, {joinedAt: old.joinedAt || p.joinedAt || Date.now(), count: Math.max(old.count || 0, p.count || 0), doneAt: old.doneAt || p.doneAt || null,
    got: Array.isArray(p.got) && (!old.got || p.got.length >= old.got.length) ? p.got : (old.got || null),
    color: PALETTE[p.color] ? p.color : (old.color || null), name: cleanName(p.name) || old.name || ""});
}
// Each player's countries are shared live so both maps color in as you go.
function myGotList(){ return round != null ? [...found.keys()] : null; }
// Live channel: each page broadcasts its own score as presence; everyone hears it instantly.
let lastPresence = "";
function pushPresence(){
  if (!room || !shared) return;
  const pr = {uid: me, round, count: found.size, done: myDone || null, joinedAt: myJoined, ready, dur: +$("dur").value, durAt, got: myGotList(), color: myColor, name: myName};
  const s = JSON.stringify(pr); if (s === lastPresence) return; lastPresence = s;
  room.presence(pr).catch(() => {});
}
function onRoomPeers(peers){
  let changed = false, newer = false;
  for (const p of peers) {
    if (p.isMe || p.kind !== "viewer") continue;
    const pr = p.presence || {}, uid = p.by || pr.uid;
    if (!uid || uid === me || typeof pr.round !== "number") continue;
    if (round == null || pr.round > round) newer = true;
    if (pr.round !== round) continue;
    mergePlayer(uid, {joinedAt: pr.joinedAt, count: +pr.count || 0, doneAt: pr.done || null, got: Array.isArray(pr.got) ? pr.got.slice(0, TOTAL).map(Number).filter(i => LIST[i]) : null, color: pr.color, name: pr.name}); changed = true;
  }
  if (newer && !isHost) send({t: "want"});
  syncDur();
  tick(); render(); maybeStart();
}
// ---- multiplayer: a direct link between the two browsers (WebRTC through PeerJS).
// PeerJS's public broker is used only to find the other browser; game data goes browser to browser.
// The host's page holds the game (round, start time, each player's record) and relays it to the guest.
const ID_PREFIX = "country-race-game-", CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", DROP_MS = 8000;
let code = null, isHost = false, peer = null, conn = null, remote = null, lastHeard = 0, dialAt = 0, full = false;
let hostGame = null, hostDocs = {round: null, players: {}};   // host only
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const hostKey = c => "country-race-host-" + c;
const cleanCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
function newCode(){ const a = crypto.getRandomValues(new Uint8Array(5)); return [...a].map(x => CODE_CHARS[x % CODE_CHARS.length]).join(""); }
function saveHost(){ if (isHost) store.set(hostKey(code), {game: hostGame, docs: hostDocs}); }
function hostPutPlayer(r, uid, doc){
  if (hostDocs.round !== r || !doc || typeof doc !== "object") return;
  // Keep only the known fields of a record that came from the other browser
  const got = Array.isArray(doc.got) ? doc.got.slice(0, TOTAL).map(Number).filter(i => Number.isInteger(i) && LIST[i]) : null;
  hostDocs.players[uid] = {joinedAt: +doc.joinedAt || Date.now(), count: Math.min(TOTAL, Math.max(0, +doc.count || 0)), doneAt: +doc.doneAt || null, got, color: PALETTE[doc.color] ? doc.color : null, name: cleanName(doc.name)};
  // First to reach the host owns the country's color
  const own = ownerMap(); let changed = false;
  for (const i of got || []) if (own[i] == null) { own[i] = uid; changed = true; }
  saveHost(); if (changed) send({t: "own", round: r, owner: own});
}
function setOwner(o){ guestOwner = o && typeof o === "object" ? o : {}; }
function send(m){ if (conn?.open) try { conn.send(m); } catch {} }
function sendState(){ send({t: "state", game: hostGame, now: Date.now(), round: hostDocs.round, players: hostDocs.players, owner: ownerMap()}); }

function onMessage(m){
  lastHeard = Date.now();
  if (!m || typeof m !== "object") return;
  switch (m.t) {
    case "hello": if (remote && typeof m.uid === "string") { remote.uid = m.uid; render(); } break;
    case "presence":
      if (!remote || !m.pr || typeof m.pr !== "object") break;
      if (!remote.uid && typeof m.pr.uid === "string") remote.uid = m.pr.uid;
      remote.presence = m.pr; remote.at = Date.now(); onRoomPeers(room.peers()); break;
    case "player":
      if (isHost) { if (!remote?.uid) break; hostPutPlayer(m.round, remote.uid, m.doc); ingestPlayers(m.round, {[remote.uid]: m.doc}); }
      else if (typeof m.uid === "string" && m.uid !== me) ingestPlayers(m.round, {[m.uid]: m.doc});
      break;
    case "want": if (isHost) sendState(); break;
    case "own": if (!isHost && round != null && m.round === round) { setOwner(m.owner); render(); } break;
    case "start":
      // The start signal carries a countdown length, not a clock time, so both screens count down together
      if (isHost || typeof m.round !== "number" || m.round <= (round || 0)) break;
      applyState({round: m.round, startedAt: Date.now() + Math.min(+m.delay || 0, 5000), duration: +m.duration || 0, endedAt: null});
      break;
    case "state": {
      if (isHost) break;
      // Times come from the host's clock; shift them onto this one
      const g = m.game && typeof m.game.round === "number" ? {...m.game} : null, skew = Date.now() - (+m.now || Date.now());
      if (g) { g.startedAt = (+g.startedAt || 0) + skew; g.endedAt = g.endedAt ? g.endedAt + skew : null; }
      if ((g?.round ?? null) !== round || (g && (g.endedAt || null) !== endedAt)) applyState(g);
      if (g && m.round === round) { setOwner(m.owner); ingestPlayers(round, m.players); }
      break;
    }
    case "full": full = true; setStatus("This game already has two players."); try { conn?.close(); } catch {} break;
  }
}
function attach(c, uid){
  if (conn && conn !== c) try { conn.close(); } catch {}
  conn = c; remote = {uid, presence: null, at: 0}; lastHeard = Date.now(); lastPresence = "";
  const gone = () => { if (c === conn) dropped(); };
  c.on("close", gone); c.on("error", gone);
  setStatus("");
}
function dropped(){
  const had = !!remote?.presence; conn = null; remote = null;
  if (had) toast("The other player disconnected");
  setStatus(isHost ? "The other player disconnected. They can rejoin with the same link." : "Lost the connection to the host. Reconnecting…");
  onRoomPeers([]); render();
  if (!isHost) { dialAt = 0; setTimeout(dial, 1500); }
}
function openHost(){
  peer = new Peer(ID_PREFIX + code, {debug: 0});
  peer.on("open", () => setStatus(""));
  peer.on("connection", c => {
    c.on("data", m => {
      if (c === conn) return onMessage(m);
      if (m?.t !== "hello" || typeof m.uid !== "string") return;
      // One guest per game; the same player coming back (after a reload) replaces their old link
      if (conn?.open && remote?.uid && remote.uid !== m.uid && Date.now() - lastHeard < DROP_MS) { c.send({t: "full"}); setTimeout(() => c.close(), 500); return; }
      attach(c, m.uid);
      send({t: "hello", uid: me}); sendState(); render();
    });
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id") setStatus("Reconnecting to the game…");   // the old page's link is still closing
    else if (e.type !== "peer-unavailable") setStatus("Can't reach the connection service. Retrying…");
  });
}
function openGuest(){
  peer = new Peer({debug: 0});
  setStatus("Connecting to the host…");
  peer.on("open", () => { dialAt = 0; dial(); });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") setStatus("Waiting for the host. Check the code, or ask them to open the game.");
    else setStatus("Can't reach the connection service. Retrying…");
  });
}
function dial(){
  if (full || conn?.open || !peer?.open || Date.now() - dialAt < 6000) return;
  dialAt = Date.now();
  const c = peer.connect(ID_PREFIX + code, {reliable: true});
  c.on("open", () => { attach(c, null); c.send({t: "hello", uid: me}); sync(); render(); });   // sync: anything found while the link was down
  c.on("data", m => { if (c === conn) onMessage(m); });
}
// Every 2 seconds: keep the link alive, notice a silent drop, and reconnect what broke.
function heartbeat(){
  if (!peer || peer.destroyed) { peer = null; return isHost ? openHost() : openGuest(); }
  if (peer.disconnected) { try { peer.reconnect(); } catch {} }
  if (conn) {
    if (conn.open) send({t: "ping"});
    if (Date.now() - lastHeard > DROP_MS) { const c = conn; try { c.close(); } catch {} if (c === conn) dropped(); }
  } else if (!isHost) dial();
  if (!isHost && !conn && dialAt && Date.now() - dialAt > 5000 && !full && peer.open)
    setStatus("Can't reach the host yet. Check the code, or ask them to open the game.");
}

// ---- boot
function setStatus(msg){ const s = $("status"); s.textContent = msg || ""; s.hidden = !msg; }
function setupRoom(){
  const go = c => { location.href = location.pathname + "?join=" + c; };
  $("hostBtn").onclick = () => { const c = newCode(); store.set(hostKey(c), {game: null, docs: {round: null, players: {}}}); go(c); };
  $("joinBtn").onclick = () => { const c = cleanCode($("code").value); if (c.length < 4) { toast("Type the game code"); return; } go(c); };
  $("code").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("joinBtn").click(); } });
  $("copyBtn").onclick = async () => {
    const url = location.origin + location.pathname + "?join=" + code;
    try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { prompt("Send this link to the other player", url); }
  };
  $("leaveBtn").onclick = () => { location.href = location.pathname; };
  $("nameInput").value = myName;
  $("nameInput").addEventListener("input", e => { myName = cleanName(e.target.value); try { localStorage.setItem("country-race-name", myName); } catch {} pushPresence(); if (shared) sync(); });
  $("roomOn").hidden = !shared; $("roomSolo").hidden = shared;
  if (shared) $("roomCode").textContent = code;
}
async function boot(){
  try { await drawMap(); } catch { setStatus("The map didn't load. Reload the page."); }
  const q = cleanCode(new URLSearchParams(location.search).get("join"));
  if (q.length >= 4) {
    code = q; shared = true; isHost = !!store.get(hostKey(code));
    me = store.get("country-race-uid");
    if (typeof me !== "string" || !me) { me = "p" + newCode() + newCode(); store.set("country-race-uid", me); }
    room = {
      peers: () => remote?.uid && remote.presence && conn?.open ? [{kind: "viewer", by: remote.uid, presence: remote.presence, updatedAt: remote.at}] : [],
      presence: pr => { send({t: "presence", pr}); return Promise.resolve(); }
    };
  }
  setupRoom();
  render(); setInterval(tick, 250); tick();
  if (!shared) return;
  if (typeof Peer !== "function") { setStatus("Couldn't load the connection library. Reload the page."); return; }
  if (isHost) { const s = store.get(hostKey(code)) || {}; hostGame = s.game || null; hostDocs = s.docs || {round: null, players: {}}; if (hostGame) applyState(hostGame); openHost(); }
  else openGuest();
  setInterval(heartbeat, 2000);
  addEventListener("pagehide", () => { try { conn?.close(); peer?.destroy(); } catch {} });
}
boot();
</script>
